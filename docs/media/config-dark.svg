</style>
<rect x="0.5" y="0.5" width="497" height="427" rx="10" fill="#161b22" stroke="#30363d"/>
<path d="M0.5 38V10.5a10 10 0 0 1 10-10h477a10 10 0 0 1 10 10V38z" fill="#21262d" stroke="#30363d"/>
<circle cx="20" cy="19" r="6" fill="#ff5f57"/><circle cx="40" cy="19" r="6" fill="#febc2e"/><circle cx="60" cy="19" r="6" fill="#28c840"/>
<text class="t" x="249" y="23" text-anchor="middle">Mistakes stop early · exit 2</text>
<text xml:space="preserve" x="22" y="70" textLength="235.2" lengthAdjust="spacingAndGlyphs"><tspan class="c">~/notes $ </tspan><tspan class="b">done-done run sync</tspan></text>
<text xml:space="preserve" x="22" y="91" textLength="436.8" lengthAdjust="spacingAndGlyphs"><tspan class="f b">error: </tspan>~/notes/.done-done.yaml: unknown key evidance</text>
<text xml:space="preserve" x="22" y="112" textLength="50.4" lengthAdjust="spacingAndGlyphs"><tspan class="d">usage:</tspan></text>
<text xml:space="preserve" x="22" y="133" textLength="445.2" lengthAdjust="spacingAndGlyphs"><tspan class="d">  done-done run [&lt;journey&gt;] [-- &lt;command...&gt;]   run a</tspan></text>
<text xml:space="preserve" x="22" y="154" textLength="428.4" lengthAdjust="spacingAndGlyphs">    <tspan class="d">journey (or command) and record the evidence it</tspan></text>
<text xml:space="preserve" x="22" y="175" textLength="84.0" lengthAdjust="spacingAndGlyphs">    <tspan class="d">writes</tspan></text>
<text xml:space="preserve" x="22" y="196" textLength="453.6" lengthAdjust="spacingAndGlyphs"><tspan class="d">  done-done run --open [&lt;journey&gt;]              open a</tspan></text>
<text xml:space="preserve" x="22" y="217" textLength="445.2" lengthAdjust="spacingAndGlyphs">    <tspan class="d">run for a hand- or agent-driven proof; prints its</tspan></text>
<text xml:space="preserve" x="22" y="238" textLength="50.4" lengthAdjust="spacingAndGlyphs">    <tspan class="d">id</tspan></text>
<text xml:space="preserve" x="22" y="259" textLength="436.8" lengthAdjust="spacingAndGlyphs"><tspan class="d">  done-done run --close &lt;run-id&gt;                seal</tspan></text>
<text xml:space="preserve" x="22" y="280" textLength="126.0" lengthAdjust="spacingAndGlyphs">    <tspan class="d">an open run</tspan></text>
<text xml:space="preserve" x="22" y="301" textLength="403.2" lengthAdjust="spacingAndGlyphs"><tspan class="d">  done-done check --outcome "&lt;claim&gt;" &lt;files...&gt;</tspan></text>
<text xml:space="preserve" x="22" y="322" textLength="210.0" lengthAdjust="spacingAndGlyphs">    <tspan class="d">[--trusted-ref &lt;ref&gt;]</tspan></text>
<text xml:space="preserve" x="22" y="343" textLength="336.0" lengthAdjust="spacingAndGlyphs"><tspan class="d">  done-done check --from &lt;file | PR URL&gt;</tspan></text>
<text xml:space="preserve" x="22" y="364" textLength="210.0" lengthAdjust="spacingAndGlyphs">    <tspan class="d">[--trusted-ref &lt;ref&gt;]</tspan></text>
<text xml:space="preserve" x="22" y="385" textLength="453.6" lengthAdjust="spacingAndGlyphs"><tspan class="d">exit codes: 0 pass, 1 fail, 2 usage or config error, 3</tspan></text>
<text xml:space="preserve" x="22" y="406" textLength="134.4" lengthAdjust="spacingAndGlyphs">    <tspan class="d">inconclusive</tspan></text>
</svg>
